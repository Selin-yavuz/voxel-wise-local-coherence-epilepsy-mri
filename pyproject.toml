[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vic-epilepsy"
version = "0.1.0"
description = "VIC/MRC MRI analysis pipeline for epilepsy research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "dicom2nifti>=2.4",
  "matplotlib>=3.8",
  "nibabel>=5.2",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "pydicom>=2.4",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "tables>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

